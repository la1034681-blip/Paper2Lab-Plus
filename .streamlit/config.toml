# Streamlit 运行配置（本地与云端共用）
# 刻意保持"最保守": 只固定一组颜色，不随系统深浅色切换 —— 云端跑出来的样子必须
# 与本地一致，否则你会遇到"本地好看、线上变了"的尴尬。
#
# 2026-10-26 UI 改版：把原生组件的主色从 Streamlit 默认的红色改成墨蓝 #12203a，
# 与页面主色一致（原来那排开关是刺眼的红，像告警）。改这一项会同时影响
# toggle / slider / checkbox 这些原生控件 —— 它们是组件库画的，CSS 改不动。

[theme]
base = "light"
primaryColor = "#12203a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fb"
textColor = "#1b2436"

[server]
headless = true
# 论文 PDF 扫件可能较大（含图），放宽上传上限（默认 200MB，这里给到 300MB）
maxUploadSize = 300
# 部署在反向代理域名后面时必须允许外部 host，否则 Streamlit 会拒绝外部请求
enableCORS = true

[browser]
gatherUsageStats = false
